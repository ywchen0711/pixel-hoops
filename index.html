<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素籃球 Pixel Hoops</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8742a' stroke='%23202020'/%3E%3Cpath d='M1 8h14M8 1v14M3 3q5 5 0 10M13 3q-5 5 0 10' stroke='%23202020' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app">
  <header class="panel bar">
    <h1>🏀 <span data-t="title"></span><small data-t="subtitle"></small></h1>
    <button id="play" class="big"></button>
    <label><span data-t="speed"></span>
      <select id="speed"><option value="1">1x</option><option value="2">2x</option><option value="4" selected>4x</option><option value="10">10x</option><option value="30">30x</option></select>
    </label>
    <button id="sim"></button>
    <button id="next" disabled></button>
    <span class="grow"></span>
    <button id="fx"></button>
    <button id="lang"></button>
    <button id="newTeams"></button>
  </header>

  <section class="panel scoreboard" id="board"></section>

  <div class="main">
    <section class="panel courtwrap">
      <canvas id="court" width="1280" height="800"></canvas>
      <div class="hud" id="hud"></div>
    </section>
    <aside class="side">
      <div class="cards">
        <div class="panel card" id="cardO"></div>
        <div class="panel card" id="cardD"></div>
      </div>
      <div class="panel playbook">
        <div class="pbhead" data-t="playbook"></div>
        <div class="pbbody">
          <canvas id="pbBoard" width="400" height="340"></canvas>
          <div class="pbtext"><h3 id="pbName">—</h3><p id="pbDesc"></p><div id="pbRoles"></div><p class="pblegend" data-t="pbLegend"></p></div>
        </div>
      </div>
      <div class="panel tabsbox">
        <div class="tabs">
          <button data-tab="log" class="on" data-t="tabLog"></button>
          <button data-tab="box" data-t="tabBox"></button>
          <button data-tab="roster" data-t="tabRoster"></button>
        </div>
        <div class="pane on" id="pane-log"><ol id="log"></ol></div>
        <div class="pane" id="pane-box"></div>
        <div class="pane" id="pane-roster"></div>
      </div>
    </aside>
  </div>
  <p class="help" data-t="help"></p>
</div>
<script src="engine.js?v=5"></script>
<script src="game.js?v=5"></script>
<script src="/hub.js" data-pos="bottom-right" defer></script>
</body>
</html>
